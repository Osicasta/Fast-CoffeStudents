<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pedido Listo | SNACKADEMIA</title>
  <link rel="stylesheet" href="css/pedido.css" />
</head>
<body>
  <div class="app">
    <!-- Tarjeta / contenido -->
    <div class="pedido-container">
      <div class="pedido-top-bar">
        <a href="menu.html" class="pedido-back-btn" title="Volver" aria-label="Volver">&#8592;</a>
      </div>

      <div class="pedido-header">
        <img src="img/logo2.png" alt="Logo Snackademia" class="logo" />
        <h1 class="title">SNACKADEMIA</h1>
      </div>

      <div class="pedido-main">
        <div class="pedido-message">Tu pedido está listo para recoger</div>
        <div id="orderSummary" aria-live="polite"></div>
      </div>
    </div>

    <!-- Footer sticky (fuera del contenedor) -->
    <footer class="bottom-nav" role="navigation" aria-label="Navegación inferior">
      <button class="nav-btn" id="footerMenu">Menú</button>
      <button class="nav-btn active" id="footerPedido">Mi Pedido</button>
      <button class="nav-btn" id="footerResenas">Reseñas</button>
    </footer>
  </div>

  <script type="module" src="src/pages/pedido.js"></script>
</body>
</html>
