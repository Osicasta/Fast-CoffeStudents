<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro | SNACKADEMIA</title>
</head>
<body>
  <div class="register-container">
    <button class="back-btn" type="button" onclick="location.replace('menuStart.html')">←</button>

    <img src="img/logo2.png" alt="Logo Snackademia" class="logo" />
    <h1 class="title">SNACKADEMIA</h1>

    <form id="registerForm" novalidate>
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="example@gmail.com" autocomplete="username" required />

      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="********" minlength="8"
             autocomplete="new-password" required />

      <!-- NUEVO: confirmar contraseña -->
      <label for="confirmPassword">Confirmar contraseña</label>
      <input type="password" id="confirmPassword" placeholder="********"
             autocomplete="new-password" required />

      <!-- Mensaje de error -->
      <small id="passwordError" class="error-msg" aria-live="polite"></small>

      <button type="submit" class="btn">Register</button>
    </form>
  </div>

  <script type="module" src="src/pages/register.js"></script>
</body>
</html>
